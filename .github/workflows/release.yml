name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  MOBILE_PROJECT: src/JHandsFree.Mobile/JHandsFree.Mobile.csproj

jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Read version
        id: version
        run: |
          version=$(grep -oP '(?<=<VersionPrefix>)[0-9]+\.[0-9]+\.[0-9]+(?=</VersionPrefix>)' Directory.Build.props | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::VersionPrefix not found in Directory.Build.props."
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          code=$((major * 10000 + minor * 100 + patch))
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version (version code $code)"

      - name: Stop if this version is already released
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::error::v$VERSION is already released. Bump VersionPrefix in Directory.Build.props as described in docs/GIT_WORKFLOW.md."
            exit 1
          fi

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install Android dependencies
        run: >
          dotnet build "$MOBILE_PROJECT"
          -t:InstallAndroidDependencies
          -f net10.0-android
          "-p:AndroidSdkDirectory=$ANDROID_HOME"
          -p:AcceptAndroidSdkLicenses=True

      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is missing in the release environment. See docs/CI_CD.md."
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - name: Publish signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: >
          dotnet publish "$MOBILE_PROJECT"
          -f net10.0-android
          -c Release
          -o "$RUNNER_TEMP/publish"
          -p:ContinuousIntegrationBuild=true
          -p:AndroidPackageFormats=apk
          -p:AndroidKeyStore=true
          "-p:AndroidSigningKeyStore=$RUNNER_TEMP/release.keystore"
          "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS"
          -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD
          -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD
          "-p:ApplicationDisplayVersion=$VERSION"
          "-p:ApplicationVersion=$CODE"

      - name: Collect APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          signed=$(find "$RUNNER_TEMP/publish" -iname '*-signed.apk' | head -n 1)
          if [ -z "$signed" ]; then
            echo "::error::No signed APK found in the publish output."
            exit 1
          fi
          target="$RUNNER_TEMP/J-HandsFree-v$VERSION.apk"
          cp "$signed" "$target"
          echo "path=$target" >> "$GITHUB_OUTPUT"

      - name: Extract release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "Release v$VERSION" > "$RUNNER_TEMP/notes.md"
            echo "::warning::No CHANGELOG section found for $VERSION."
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
        run: >
          gh release create "v$VERSION" "$APK"
          --title "J-HandsFree v$VERSION"
          --notes-file "$RUNNER_TEMP/notes.md"
          --target "$GITHUB_SHA"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
