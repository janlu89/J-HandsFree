name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: JHandsFree.slnx
  MOBILE_PROJECT: src/JHandsFree.Mobile/JHandsFree.Mobile.csproj

jobs:
  scripts:
    name: Player scripts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/player-scripts
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/player-scripts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Bundle
        run: npm run build

  dotnet:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: 21

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install .NET MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install Android dependencies
        run: >
          dotnet build "$MOBILE_PROJECT"
          -t:InstallAndroidDependencies
          -f net10.0-android
          "-p:AndroidSdkDirectory=$ANDROID_HOME"
          -p:AcceptAndroidSdkLicenses=True

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Verify formatting
        run: dotnet format "$SOLUTION" --verify-no-changes --no-restore

      - name: Build
        run: dotnet build "$SOLUTION" -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        run: >
          dotnet test "$SOLUTION"
          -c Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14
