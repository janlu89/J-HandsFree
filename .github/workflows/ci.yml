name: CI

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION: JHandsFree.slnx
  MOBILE_PROJECT: src/JHandsFree.Mobile/JHandsFree.Mobile.csproj
  SCRIPTS_DIR: src/player-scripts

jobs:
  scripts:
    name: Player scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Detect scripts project
        id: detect
        run: |
          if [ -f "$SCRIPTS_DIR/package.json" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No player scripts project yet; skipping script checks."
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/player-scripts/package-lock.json

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        working-directory: src/player-scripts
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        working-directory: src/player-scripts
        run: npm run lint

      - name: Test
        if: steps.detect.outputs.present == 'true'
        working-directory: src/player-scripts
        run: npm test

      - name: Bundle
        if: steps.detect.outputs.present == 'true'
        working-directory: src/player-scripts
        run: npm run build

  dotnet:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Detect solution
        id: detect
        run: |
          if [ -f "$SOLUTION" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No solution yet; skipping .NET build and tests."
          fi

      - name: Set up .NET
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up JDK
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: 21

      - name: Set up Node.js
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install .NET MAUI Android workload
        if: steps.detect.outputs.present == 'true'
        run: dotnet workload install maui-android

      - name: Install Android dependencies
        if: steps.detect.outputs.present == 'true'
        run: >
          dotnet build "$MOBILE_PROJECT"
          -t:InstallAndroidDependencies
          -f net10.0-android
          "-p:AndroidSdkDirectory=$ANDROID_HOME"
          -p:AcceptAndroidSdkLicenses=True

      - name: Restore
        if: steps.detect.outputs.present == 'true'
        run: dotnet restore "$SOLUTION"

      - name: Verify formatting
        if: steps.detect.outputs.present == 'true'
        run: dotnet format "$SOLUTION" --verify-no-changes --no-restore

      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: dotnet build "$SOLUTION" -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: >
          dotnet test "$SOLUTION"
          -c Release
          --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        if: always() && steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
          retention-days: 14
