name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a playlist
        2. Turn the screen off
        3. ...
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: v0.4.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone model and Android version
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: input
    id: webview-version
    attributes:
      label: Android System WebView version
      description: Settings, Apps, Android System WebView
  - type: textarea
    id: logs
    attributes:
      label: Diagnostics log
      description: Attach the log exported from the app settings, if available.
