version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      nuget:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /src/player-scripts
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # typescript-eslint 8.71 accepts TypeScript below 6.1 only (peer dependency), so a newer TypeScript fails npm ci.
      # Raise this bound when typescript-eslint accepts a newer TypeScript.
      - dependency-name: typescript
        versions: [">= 6.1.0"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
